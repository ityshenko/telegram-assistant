services:
  - type: web
    name: telegram-assistant
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOUR_CHAT_ID
        sync: false
      - key: DIGEST_TIME
        value: "20:00"
